[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stoqlib"
version = "7.14.0"
description = "A powerful retail system"
authors = [{name = "Stoq Team", email = "dev@stoq.com.br"}]
license = {text = "LGPL-2.0"}
requires-python = ">=3.9"
dependencies = [
    "kiwi-gtk>=3.0.4",
    "lxml>=3.5.0",
    "mako>=1.0.3",
    "pillow>=3.1.2",
    "psycopg2-binary>=2.7.4",
    "pyjwt>=1.3.0",
    "pyopenssl>=17.0.0",
    "python-dateutil>=2.4.2",
    "python-nss>=1.0.0",
    "sentry-sdk>=2.0.0",
    "reportlab>=3.3.0",
    "requests>=2.9.1",
    "stoqdrivers>=2.0.0",
    "storm>=0.24",
    "weasyprint>=0.34",
    "xlwt>=1.2.0",
    "zope.interface>=4.1.3",
]

[project.optional-dependencies]
dev = [
    "coverage>=5.3",
    "docutils>=0.16",
    "pycodestyle>=2.6.0",
    "pyflakes>=2.2.0",
    "pytest>=6",
    "pytest-cov>=2.10.1",
    "pytest-stoq>=0.7.0",
    "bump2version>=1.0.1",
]

[project.scripts]
stoqdbadmin = "stoq.dbadmin:run"

[tool.setuptools.packages.find]
include = ["stoq*", "stoqlib*", "plugins*"]

[tool.isort]
known_local_folder = ["stoq", "stoqlib"]
src_paths = ["stoq", "stoqlib", "plugins", "tests"]
